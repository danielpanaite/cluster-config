---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pocketid
  namespace: auth
data:
  APP_URL: "https://auth.hyrax-ghoul.ts.net"
  PUID: "3000"
  PGID: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: pocketid
  namespace: auth
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.255.200
  selector:
    app: pocketid
  ports:
    - protocol: TCP
      port: 80
      name: http
      targetPort: 1411
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketid
  namespace: auth
  labels:
    app: pocketid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocketid
  template:
    metadata:
      labels:
        app: pocketid
    spec:
      securityContext:
        runAsUser: 3001
        runAsGroup: 3001
        fsGroup: 3001
      volumes:
        - name: pocketid-vol
          persistentVolumeClaim:
            claimName: pocketid
      containers:
      - name: pocketid
        image: pocketid/pocket-id:v2.14.0
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "125Mi"
            cpu: "250m"
          limits:
            memory: "500Mi"
            cpu: "1000m"
        envFrom:
          - configMapRef:
              name: pocketid
          - secretRef:
              name: pocketid

        ports:
        - containerPort: 1411

        volumeMounts:
          - mountPath: /app/data
            name: pocketid-vol
            subPath: data