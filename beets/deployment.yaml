---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beets-config
  namespace: media
data:
  config.yaml: |
    directory: /downloads
    library: /config/musiclibrary.db

    plugins: musicbrainz fetchart embedart zero convert lyrics web

    original_date: true
    per_disc_numbering: true
    id3v23: true

    paths:
      default: $albumartist/$album%aunique{}/$track $albumartist - $title
      singleton: $artist/$title

    import:
      write: yes
      copy: no
      move: no
      timid: yes
      resume: ask

    fetchart:
      auto: yes
      minwidth: 500
      maxwidth: 1200

    embedart:
      auto: yes

    zero:
      auto: yes
      keep_fields: title artist artists artist_sort album albumartist albumartist_sort track tracktotal disc disctotal length date original_date original_year year month day media script isrc label barcode albumtype albumstatus country mb_albumid mb_artistid mb_albumartistid mb_releasegroupid mb_releasetrackid mb_trackid lyrics encoder images

    convert:
      auto: no
      auto_keep: no
      dest: /music
      format: mp3
      embed: yes
      write_metadata: yes
      never_convert_lossy_files: yes
      formats:
        mp3:
          command: ffmpeg -i $source -map 0:a -map 0:v? -map_metadata -1 -c:a libmp3lame -b:a 320k -c:v copy -id3v2_version 3 -disposition:v attached_pic -y $dest
          extension: mp3

    lyrics:
      auto: yes
      fallback: null
      force: yes
      keep_synced: yes
      print: no
      rest_directory: null
      sources: [lrclib]
      synced: yes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beets-script
  namespace: media
data:
  beet-import.sh: |
    #!/bin/sh

    for arg in "$@"; do
        if [ "$arg" = "-h" ] || [ "$arg" = "--help" ]; then
            echo "Usage: beet-import [beets import flags & arguments]"
            echo ""
            echo "Description:"
            echo "  A wrapper script for beets that runs an interactive import (e.g., -t)"
            echo "  and automatically triggers 'beet convert' on the most recently"
            echo "  added album after the import successfully completes."
            echo ""
            echo "Examples:"
            echo "  beet-import -t /music/incoming/album"
            echo "  beet-import /music/incoming/single-track"
            exit 0
        fi
    done

    beet import "$@"

    latest_album=$(beet ls -a -f '$album' added- | head -n 1)

    if [ -n "$latest_album" ]; then
        echo "Automatically converting latest album: $latest_album"
        beet convert -a -y album:"$latest_album"
    else
        echo "No new album found to convert."
    fi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beets
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beets
  template:
    metadata:
      labels:
        app: beets
    spec:
      securityContext:
        fsGroup: 3001
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: beets-config-vol
          configMap:
            name: beets-config
        - name: script-volume
          configMap:
            name: beets-script
            defaultMode: 0755
        - name: slskd-vol
          persistentVolumeClaim:
            claimName: slskd
        - name: navidrome-vol
          persistentVolumeClaim:
            claimName: navidrome
      containers:
        - name: beets
          image: lscr.io/linuxserver/beets:2.14.1
          env:
            - name: PUID
              value: "3001"
            - name: PGID
              value: "3001"
            - name: TZ
              value: "Asia/Tokyo"
          volumeMounts:
            - name: beets-config-vol
              mountPath: /config/config.yaml
              subPath: config.yaml
            - name: script-volume
              mountPath: /usr/local/bin/beet-import
              subPath: beet-import.sh
            - name: slskd-vol
              mountPath: /downloads
            - name: navidrome-vol
              mountPath: /music
              subPath: music