---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-postgres
  namespace: bookorbit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
