---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
  namespace: bookorbit
data:
  POSTGRES_USER: bookorbit
  POSTGRES_DB: bookorbit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bookorbit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      volumes:
        - name: postgres-vol
          persistentVolumeClaim:
            claimName: bookorbit-postgres
      containers:
      - name: postgres
        image: pgvector/pgvector:0.8.7-pg18
        resources:
          requests:
            cpu: 25m
            memory: 150M
          limits:
            cpu: 500m
            memory: 500M
        ports:
          - containerPort: 5432
        volumeMounts:
          - mountPath: "/var/lib/postgresql"
            name: postgres-vol
        envFrom:
          - configMapRef:
              name: postgres
          - secretRef:
              name: bookorbit
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bookorbit
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: tcp
  selector:
    app: postgres
---
